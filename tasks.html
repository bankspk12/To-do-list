<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasknest - รายการสิ่งที่ต้องทำ</title>
    <meta name="description" content="Tasknest - จัดการรายการสิ่งที่ต้องทำและวางแผนงาน">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Firebase SDK (Compat Version for Vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content" id="mainContent">
        <div class="container">
            <h1>📝 Tasknest รายการสิ่งที่ต้องทำ</h1>

            <!-- Search Bar -->
            <div class="search-bar" id="searchBar">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="ค้นหางาน...">
                <button id="clearSearchBtn" class="clear-search-btn" style="display:none;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section" id="progressSection">
                <div class="progress-info">
                    <span id="progressText">0 / 0 งานเสร็จ</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width:0%"></div>
                </div>
            </div>

            <!-- Add Task Input Group -->
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="เพิ่มงานใหม่... (หรือกด Ctrl+K เพื่อจดด่วน)">
                <select id="taskCategory">
                    <option value="งาน">🏢 งาน</option>
                    <option value="ส่วนตัว">👤 ส่วนตัว</option>
                    <option value="การเรียน">📚 การบ้าน</option>
                    <option value="อื่นๆ">📌 อื่นๆ</option>
                </select>
                <input type="date" id="taskDueDate" title="วันครบกำหนด">
                <input type="number" id="taskEstHours" min="0" step="0.5" placeholder="ชม." style="width: 70px;" title="ประเมินเวลา (ชั่วโมง)">
                <select id="taskPriority">
                    <option value="high">🔴 P0 - สำคัญด่วน</option>
                    <option value="medium" selected>🟡 P1 - ปานกลาง</option>
                    <option value="low">🟢 P2 - ทั่วไป</option>
                </select>
                <button id="addTaskBtn">+ เพิ่มงาน</button>
            </div>

            <!-- Toolbar: Filters + View Toggle -->
            <div class="task-toolbar">
                <div class="task-filters">
                    <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
                    <button class="filter-btn" data-filter="pending">รอดำเนินการ</button>
                    <button class="filter-btn" data-filter="completed">เสร็จแล้ว</button>
                    <button class="filter-btn" data-filter="high">สำคัญสูง (P0)</button>
                </div>
                <div class="view-toggle">
                    <button class="view-btn active" id="listViewBtn" title="มุมมองลิสต์">
                        <i class="fas fa-list"></i>
                    </button>
                    <button class="view-btn" id="calendarViewBtn" title="มุมมองปฏิทิน">
                        <i class="fas fa-calendar-alt"></i>
                    </button>
                </div>
            </div>

            <!-- List View -->
            <ul id="taskList"></ul>

            <!-- Calendar View -->
            <div id="calendarView" class="calendar-view" style="display:none;">
                <div class="cal-header">
                    <button id="calPrev" class="cal-nav-btn"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="calMonthYear"></h2>
                    <button id="calNext" class="cal-nav-btn"><i class="fas fa-chevron-right"></i></button>
                    <button id="calToday" class="cal-today-btn">วันนี้</button>
                </div>
                <div class="cal-weekdays">
                    <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
                </div>
                <div id="calDays" class="cal-days"></div>
            </div>
        </div>
    </div>

    <!-- Core App Modules -->
    <script src="js/firebase-config.js"></script>
    <script src="js/storage-adapter.js"></script>
    <script src="js/modules/theme.js"></script>
    <script src="js/modules/toast.js"></script>
    <script src="js/modules/export.js"></script>
    <script src="js/modules/sidebar.js"></script>
    <script src="js/modules/smart-date.js"></script>
    <script src="js/modules/modals.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
